<div class="p-4 fadein animation-duration-500 leads-page">
  <div class="mb-5 flex align-items-center justify-content-between">
    <div>
      <h1 class="text-3xl font-bold m-0 text-900 font-serif">Leads</h1>
      <span class="text-gray-500 font-medium">{{ totalRecords }} leads encontrados</span>
    </div>

    <button
      pButton
      label="Criar Lead"
      icon="pi pi-plus"
      class="p-button-success border-round-lg shadow-1 px-4 py-2 font-bold"
      (click)="openNewLeadModal()"
    ></button>
  </div>

  <app-lead-filter
    [leadsData]="leads"
    (filterChange)="handleFilterChange($event)"
  ></app-lead-filter>
  <app-lead-create (onSave)="onLeadCreated()"></app-lead-create>

  <!-- ===================== SKELETON LOADING ===================== -->
  <div *ngIf="loading" class="grid mt-5 skeleton-grid">
    <div class="col-12 md:col-6 lg:col-4 xl:col-3" *ngFor="let i of skeletonItems">
      <div class="lead-card-skeleton">
        <!-- Nome -->
        <p-skeleton width="70%" height="1.1rem" styleClass="mb-2" borderRadius="6px"></p-skeleton>
        <p-skeleton width="45%" height="0.75rem" styleClass="mb-4" borderRadius="6px"></p-skeleton>
        <!-- Ícones + info -->
        <div class="flex align-items-center gap-2 mb-3">
          <p-skeleton shape="circle" size="1.85rem"></p-skeleton>
          <p-skeleton width="55%" height="0.8rem" borderRadius="6px"></p-skeleton>
        </div>
        <div class="flex align-items-center gap-2 mb-3">
          <p-skeleton shape="circle" size="1.85rem"></p-skeleton>
          <p-skeleton width="50%" height="0.8rem" borderRadius="6px"></p-skeleton>
        </div>
        <div class="flex align-items-center gap-2 mb-4">
          <p-skeleton shape="circle" size="1.85rem"></p-skeleton>
          <p-skeleton width="65%" height="0.8rem" borderRadius="6px"></p-skeleton>
        </div>
        <!-- Badge status -->
        <p-skeleton width="5rem" height="1.4rem" borderRadius="6px" styleClass="mb-3"></p-skeleton>
        <!-- Rodapé -->
        <div class="flex justify-content-between align-items-center mt-auto pt-3" style="border-top: 1px solid #f3f4f6">
          <p-skeleton width="4rem" height="1.4rem" borderRadius="8px"></p-skeleton>
          <p-skeleton width="3.5rem" height="0.75rem" borderRadius="6px"></p-skeleton>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== CONTEÚDO REAL ===================== -->
  <div class="grid mt-5" *ngIf="!loading && leads.length > 0">
    <div class="col-12 md:col-6 lg:col-4 xl:col-3" *ngFor="let lead of leads">
      <div
        (click)="viewDetails(lead.id)"
        class="lead-card cursor-pointer h-full flex flex-column relative"
        [ngClass]="{ 'is-priority': lead.isPriority }"
      >
        <div class="flex justify-content-between align-items-start mb-3">
          <div class="flex flex-column gap-1 flex-1 min-w-0">
            <span
              class="lead-name white-space-nowrap overflow-hidden text-overflow-ellipsis"
              pTooltip="{{ lead.name }}"
              tooltipPosition="top"
            >
              {{ lead.name }}
            </span>

            <span
              class="text-500 text-sm font-medium flex align-items-center gap-1"
              *ngIf="lead.cpf"
            >
              <i class="pi pi-id-card text-xs"></i> {{ lead.cpf }}
            </span>
          </div>

          <div class="flex gap-1 -mt-1 -mr-2 flex-shrink-0">
            <button
              pButton
              type="button"
              icon="pi pi-pencil"
              class="p-button-rounded p-button-text p-button-secondary"
              (click)="editLead(lead, $event)"
              pTooltip="Editar"
            ></button>

            <button
              pButton
              type="button"
              icon="pi pi-trash"
              class="p-button-rounded p-button-text p-button-danger"
              (click)="deleteLead(lead, $event)"
              pTooltip="Excluir"
            ></button>
          </div>
        </div>

        <div class="flex flex-column gap-3 mb-4">
          <div class="flex align-items-center gap-2">
            <div class="icon-circle flex-shrink-0"><i class="pi pi-map-marker"></i></div>
            <span class="text-700 font-medium text-sm">{{ lead.city }}</span>
          </div>

          <div class="flex align-items-center gap-2">
            <div class="icon-circle flex-shrink-0"><i class="pi pi-phone"></i></div>
            <span class="text-700 font-medium text-sm">{{ lead.phone }}</span>
          </div>

          <div class="flex align-items-center gap-2">
            <div class="icon-circle flex-shrink-0"><i class="pi pi-envelope"></i></div>
            <span class="text-700 font-medium text-sm truncate" pTooltip="{{ lead.email }}">{{
              lead.email
            }}</span>
          </div>

          <div class="flex align-items-center gap-1">
            <p-tag [value]="lead.status" [severity]="getStatusSeverity(lead.status)"></p-tag>
          </div>
        </div>

        <div
          class="flex align-items-center justify-content-between text-xs mt-auto pt-3 border-top-1 surface-border"
        >
          <div class="area-pill">
            <i class="pi pi-box"></i>
            <span>{{ lead.area }} ha</span>
          </div>

          <div class="flex flex-column align-items-end gap-1">
            <span class="text-500 flex align-items-center gap-1" pTooltip="Data de Criação">
              <i class="pi pi-calendar"></i> {{ lead.createdAt | date : 'dd/MM/yy' }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <p-paginator
    *ngIf="!loading && leads.length > 0"
    [first]="first"
    [rows]="rows"
    [totalRecords]="totalRecords"
    [rowsPerPageOptions]="[12, 24, 48]"
    (onPageChange)="onPageChange($event)"
  ></p-paginator>

  <div *ngIf="!loading && leads.length === 0" class="empty-state mt-5">
    <i class="pi pi-search"></i>
    <h3>Nenhum lead encontrado</h3>
    <p>Não encontramos resultados para sua busca. Tente ajustar os filtros.</p>
  </div>
</div>
